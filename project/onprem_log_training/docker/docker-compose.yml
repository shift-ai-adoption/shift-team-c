# onprem_log_training — client (アプリケーション層) + server (機能/業務ロジック層) の
# 2コンテナ構成。`docker compose up -d --build` で両方が同時に起動する。
#
# 非対称設計(意図的):
# - training-client: SSH非搭載。ログ (client/logs/app.log) はホストへbind mountし、
#   学習者がSSH無しで直接読める状態を維持する。
# - training-server: SSH搭載。ログ (/app/logs/service.log) はコンテナ内のみに置き、
#   学習者がSSH経由でのみ収集できるようにする(収集練習の対象、bind mountしない)。

services:
  training-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: ${CLIENT_DOCKER_IMAGE:-onprem-log-training-client:latest}
    container_name: onprem-log-training-client
    hostname: training-client
    ports:
      - "${CLIENT_HTTP_PORT:-3002}:3002"
    environment:
      - PORT=3002
      # compose内ではサービス名で解決する。ローカル(Dockerなし)クイックスタート用の
      # .env の SERVER_BASE_URL=http://localhost:4002 とは別経路なので、ここで明示的に上書きする。
      - SERVER_BASE_URL=http://training-server:4002
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
    volumes:
      - ../client/logs:/app/logs
    depends_on:
      training-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - onprem-log-training-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/"]
      interval: 30s
      timeout: 10s
      retries: 3

  training-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    # ローカルビルド時のタグ。オンプレでpull運用する場合は .env の DOCKER_IMAGE を
    # docker.io/<user>/<repo>:<tag> のフルパスで指定すること。
    image: ${DOCKER_IMAGE:-onprem-log-training-server:latest}
    container_name: onprem-log-training-server
    hostname: training-server
    ports:
      - "${SSH_PORT:-5101}:22"
      - "${SERVER_HTTP_PORT:-4002}:4002"
    # コンテナ実行時 (node server.js プロセス) が外部通信を行う場合に備えたプロキシ設定。
    # USE_PROXY=false の場合は空文字列になり、プロキシなしで動作する。
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
    restart: unless-stopped
    networks:
      - onprem-log-training-network
    healthcheck:
      test: ["CMD", "pgrep", "sshd"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  onprem-log-training-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
